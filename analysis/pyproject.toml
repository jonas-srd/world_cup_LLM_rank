[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "soccerarena-analysis"
version = "0.1.0"
description = "Reproducible KDD analysis pipeline for LLM SoccerArena"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<23",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "sentence-transformers>=5.1,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
soccerarena-analysis = "soccerarena_analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soccerarena_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the lint contract stable across Ruff releases: syntax/import hygiene and
# Pyflakes correctness, without opting into every newly introduced opinionated rule.
select = ["E4", "E7", "E9", "F", "I"]
